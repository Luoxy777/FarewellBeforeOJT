    "Wahh, kamu akan mengalahkan kakakmu sungguh. Tidak perlu menjadi ilmuan NASA untuk memenangkan permainan catur."
    Vivian hanya merasa kejadian itu cukup unik. Ia meletakkan laptopnya di meja, menunggu tepat pukul 7 pagi.
    Clio yang melihat adiknya justru bersantai-santai, mulai merasa iri. 
    "Peiaa.. kakakmu ini sedang persiapan ujian kamu malah bersantai??"

    Clio melihat ke sekitar sebelum tiba-tiba berdiri.
    "Ujian tidak ujian aku tetap jenius. Peia, ayo, main denganku saja," ucapnya sambil berdiri ke samping adiknya dan menarik lengannya.

    “Aku tidak bisa seusia dengannya! Aku jelas lebih dewasa!" ketus Clio.
    Lucas mendengkus mendengarnya, "Dih, alay, naik motor saja pasti belum bisa, belagu," ucapnya sebelum melihat ke arah Liam dan mengedipkan salah satu matanya. Liam yang melihat itu hanya bisa menahan senyumannya.

    Sheva yang duduk di depan kursi guru itu berbalik mendengar kebisingan itu. Sheva dapat melihat Lucas sudah hendak membuka mulutnya, namun dengan cepat ia menyela, "Lucas." Karena nada suaranya yang rendah dan tegas, ucapan Sheva langsung menarik perhatian orang dalam kelas.
    "Hentikan. Ada Miss Vivian di sini, kalian masih mau berisik?"
    Vivian menghela napas. Ia tengah mencetak soal ujian yang diminta Jes dengan printer yang diletakkan di bawah meja guru. Vivian ikut menambahi, "Jika ingin menghargai teman kalian yang memilih ujian, jangan berisik."

    "Peia!" Clio tidak terima.
    Peia menekan kedua bibirnya sejenak. Ia memiih untuk memasukkan bukunya ke lemari meja.

    Mereka masing-masing mengerjakan ujian. Sampai pukul sembilan. Liam mengajak Clio dan Peia untuk ikut dengannya bermain kamera. Kemudian Amos dan Lucas memilih untuk mengganti baju mereka dan mencari kegiatan bersama anak-anak kelas lain yang tengah pelajaran olahraga, diikuti dengan Muna dan Ina yang bosan dan memilih mengikuti Lucas.

    Vivian berjalan mendekat ke arah Jes, melihatnya yang sudah mengerjakan soal ujian mata pelajaran semester tiga. Jangan tanya bagaimana bisa, selain otaknya itu bekerja seperti mesin pencarian dan tangannya menulis cursive bagai tulisan diary, Jes juga meminta Miss Vivian untuk memberinya soal ujian sampai malam hari. Jes memintanya untuk bertemu di ruang fokus perpustakaan untuk melanjutkan ujian.
    Jes sangat bagus dalam fisika dan matematika, ia mendapatkan nilai sempurna tanpa terlihat perlu mengerahkan tenaga agar sel-sel otaknya bekerja. Untuk mata pelajaran lainnya, nilainya hampir sempurna. Vivian memeriksa latar belakang kehidupan SMPnya dan dengan prestasi sebanyak itu, ia kemungkinan besar sudah mempelajari seluruh mata pelajaran sekolah.
    Jes dengan nama lengkap Jonathan Sage itu anak yang paling pintar dan multitalenta di kelas Untitled. Bahkan jika ia pendiam, ia pernah menjadi saingan Sheva dan Lucas di lomba debat. Itu karena pengetahuan dan kemampuan bahasanya di atas rata-rata.
    Jika dibandingkan dengan Clio? Clio lebih manusiawi, meski berandal itu punya logika tinggi dan kemampuan memori yang kuat yang membuatnya mudah memahami konsep apa saja. Clio sangat emosional, ia ekspresif dengan apa yang diinginkannya. Clio bukan tipe orang yang mau mengalah alias sangat keras kepala. Nuansa yang berbeda dengan Jes yang tampak kalem.

    ✽

    Sheva sudah menyelesaikan belajarnya. Ia hendak mencari Muna untuk bermain ketika matanya menangkap Jes yang duduk di meja belakang, dengan ekspresi kosong, tangannya masih mengerjakan soal ujian.

    "Ujian apa?"
    "Sejarah Dunia, semester tiga, bab 5," jawab Jes apa adanya. 
    "Kalau aku tunggu, apa kamu mau keluar? Kita bisa berolahraga bersama?"

    Jes menoleh dan jepret!
    Peia tersenyum puas melihat hasilnya, melepas kalung kamera dan menunjukkan layarnya ke arah Jes. "Bagaimana?"
    Jes menatap foto yang disodorkan padanya, "Apanya?"
    Clio yang sudah menyusul masuk dengan Liam itu menyela, "Bagaimana? Tidakkah menyebalkan melihat wajahmu sendiri di foto itu? Bahkan AI sekarang lebih ekspresif daripada kamu."

    Suara lembut Peia kembali terdengar, "Mau tersenyum? Biar aku foto lagi."
    Clio berdecak, "Yaampun apa dia bahkan bisa tersenyum??"

    "Sungguh? Aku yakin kau tidak akan tertawa dengan lelucon apapun, apalagi menangis menonton Seven Pounds! Psikopat," tambah Clio yang merasa menggoda Jes tampaknya menyenangkan.

    Jes sudah menjadi teman sebangkunya selama seminggu. Peia tidak terlalu senang duduk di depan tetapi ingin duduk di meja dekat jendela. Jadi mau tidak mau ia duduk bersampingan dengan Jes yang sudah lebih dulu duduk di sisi kanan meja itu. Andai itu orang lain, pasti ia sudah ditanya-tanyai tentang sifat albinonya dan apa rasanya sebagai albino. Namun, Jes tidak, Jes hanya terkadang menatap wajahnya, kemudian kembali fokus mengerjakan apalah itu yang ada di atas mejanya.

    "Jes, aku ingin lihat kamu tersenyum," gumam Peia.

        };

        let currentChapter = 1;

        function loadChapter(num) {
            currentChapter = Number(num);
            const chapter = chapters[currentChapter];

            if (chapter.locked) {
                // Get preview text
                let preview = chapter.content.substring(0, 400); // first 200 chars
                // Display preview with fade effect
                document.getElementById('chapter-content').innerHTML = `<div class= "locked-preview">${formatTextForHTML(preview)}<div class="fade-overlay"></div></div>`;
            } else {
                const rawText = chapter.content;
                document.getElementById('chapter-content').innerHTML = formatTextForHTML(rawText);
            }

            document.getElementById('chapterSelect').value = currentChapter;
        }


        function formatTextForHTML(text) {
            return text
                .replace(/\t/g, "&nbsp;&nbsp;&nbsp;&nbsp;")
                .replace(/  /g, "&nbsp;&nbsp;")
                .replace(/\n/g, "<br>");
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentChapter > 1) loadChapter(currentChapter - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            let next = currentChapter + 1;
            if (chapters[next]) loadChapter(next);
        });

        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (text === '') return;
            const commentList = document.getElementById('commentsList');
            const p = document.createElement('p');
            p.textContent = text;
            commentList.appendChild(p);
            input.value = '';
            commentList.scrollTop = commentList.scrollHeight;
        }

        // Load first chapter by default
        loadChapter(1);

        document.getElementById("comment-input").addEventListener("submit", function (e) {
            e.preventDefault();
            const form = e.target;
            const formData = {
                formName: "UntitledCommentaries", // target sheet
                input: e.target.comment.value,
            };

            fetch("https://script.google.com/macros/s/AKfycbxHKOczKA1DBsXVJ0i3VRNPURrk0E90gldq1anxNL8gBFOW_-CmfXuvbUhylPX91J3ExA/exec", {
                method: "POST",
                body: JSON.stringify(formData)
            })
                .then(res => res.json())
                .then(data => {
                    alert("Saved to " + data.sheet + " successfully!");
                    form.reset();
                })
                .catch(err => alert("Error: " + err));
        });
