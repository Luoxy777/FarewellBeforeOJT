<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Overlay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .open-gallery-btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            background: #007bff;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            padding: 40px 20px;
            z-index: 999;
        }

        .close-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            z-index: 1000;
        }

        /* Gallery layout with flex */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .gallery img {
            height: 240px;
            width: auto;
            border-radius: 10px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            transition: transform 0.3s, opacity 0.3s;
        }

        .gallery img.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .lightbox img {
            max-height: 90%;
            max-width: 90%;
            border-radius: 10px;
        }

        .lightbox .nav {
            position: absolute;
            top: 50%;
            font-size: 40px;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        .lightbox .prev {
            left: 30px;
        }

        .lightbox .next {
            right: 30px;
        }
    </style>
</head>

<body>
    <button class="open-gallery-btn">Open Gallery</button>

    <div class="overlay" id="overlay">
        <span class="close-btn" id="closeBtn">&times;</span>
        <div class="gallery" id="gallery" style="padding-bottom:100px;"></div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="nav prev" id="prev">&#10094;</span>
        <img id="lightbox-img" src="" alt="">
        <span class="nav next" id="next">&#10095;</span>
    </div>

    <script>
        // Only image names here
        const imageNames = [
            "pic1.png",
            "pic2.png",
            "pic3.png",
            "pic4.png",
            "pic5.png",
            "pic6.png",
            "pic7.png",
            "pic8.png",
            "pic9.png",
            "pic10.png",
            "pic11.png",
            "pic12.png",
            "pic13.png",
            "pic14.png",
            "pic15.png",
            "pic16.png",
            "pic17.png",
            "pic18.png",
            "pic19.png",
            "pic20.png",
            "pic21.png",
            "pic22.png",
            "pic23.png"
        ];

        const folderPath = "assets/"; // <-- adjust folder path here
        const gallery = document.getElementById("gallery");
        const overlay = document.getElementById("overlay");
        const openGalleryBtn = document.querySelector(".open-gallery-btn");
        const closeBtn = document.getElementById("closeBtn");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const prevBtn = document.getElementById("prev");
        const nextBtn = document.getElementById("next");

        let currentIndex = 0;

        // Build gallery dynamically
        imageNames.forEach((name, index) => {
            const img = document.createElement("img");
            img.src = folderPath + name;
            img.dataset.index = index;
            img.addEventListener("click", () => openLightbox(index));
            gallery.appendChild(img);
        });

        // Open overlay
        openGalleryBtn.addEventListener("click", () => {
            overlay.style.display = "flex";
            const images = gallery.querySelectorAll("img");
            images.forEach((img, i) => {
                setTimeout(() => img.classList.add("show"), i * 200);
            });
        });

        // Close overlay
        closeBtn.addEventListener("click", () => {
            overlay.style.display = "none";
            gallery.querySelectorAll("img").forEach(img => img.classList.remove("show"));
        });

        // Open lightbox
        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = folderPath + imageNames[currentIndex];
            lightbox.style.display = "flex";
        }

        // Close lightbox
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) {
                lightbox.style.display = "none";
            }
        });

        // Navigation
        prevBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + imageNames.length) % imageNames.length;
            lightboxImg.src = folderPath + imageNames[currentIndex];
        });

        nextBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % imageNames.length;
            lightboxImg.src = folderPath + imageNames[currentIndex];
        });
    </script>
</body>

</html>
