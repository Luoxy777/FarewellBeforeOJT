<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Gallery Overlay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Button to open overlay */
        .open-gallery {
            margin: 20px;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 6px;
        }

        /* Overlay background */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        /* Close button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Gallery grid */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 90%;
        }

        .gallery img {
            height: 240px;
            width: auto;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: scale(0.5);
            animation: zoomIn 0.6s forwards;
        }

        /* Animation keyframes */
        @keyframes zoomIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <button class="open-gallery">Show Gallery</button>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
        <button class="close-btn" id="closeBtn">&times;</button>
        <div class="gallery" id="gallery">
            <!-- Images will load here -->
        </div>
        <div class="lightbox" id="lightbox" aria-modal="true" role="dialog">
            <button class="lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
            <img id="lightboxImg" alt="Zoomed image" />
        </div>
    </div>

    <script>
        const openBtn = document.querySelector('.open-gallery');
        const closeBtn = document.getElementById('closeBtn');
        const overlay = document.getElementById('overlay');
        const gallery = document.getElementById('gallery');
        let currentIndex = -1;
        // Example images (replace with your actual folder paths)
        const images = [
            "assets/pic1.png",
            "assets/pic2.png",
            "assets/pic3.png",
            "assets/pic4.png",
            "assets/pic1.png",
            "assets/pic2.png",
            "assets/pic3.png",
            "assets/pic4.png",
            "assets/pic1.png",
            "assets/pic2.png",
            "assets/pic3.png",
            "assets/pic4.png"
        ];

        openBtn.addEventListener('click', () => {
            overlay.style.display = 'flex';
            gallery.innerHTML = ""; // reset before adding

            // Animate images one by one
            images.forEach((src, i) => {
                const img = document.createElement('img');
                img.src = src;
                img.style.animationDelay = `${i * 0.2}s`; // stagger effect
                img.addEventListener("click", () => openLightbox(i));
                gallery.appendChild(img);
            });
        });
        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[currentIndex];
            lightbox.classList.add("active");
        }
        function closeLightbox() {
            lightbox.classList.remove("active");
            lightboxImg.src = "";
            currentIndex = -1;
        }

        lightboxClose.addEventListener("click", closeLightbox);

        // Close lightbox by clicking its dark background
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener("keydown", (e) => {
            const lbOpen = lightbox.classList.contains("active");
            if (e.key === "Escape") {
                if (lbOpen) closeLightbox(); else closeOverlay();
            }
            if (!lbOpen) return;

            if (e.key === "ArrowRight") {
                currentIndex = (currentIndex + 1) % images.length;
                lightboxImg.src = images[currentIndex];
            } else if (e.key === "ArrowLeft") {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                lightboxImg.src = images[currentIndex];
            }
        });
        closeBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
        });
    </script>

</body>

</html>
