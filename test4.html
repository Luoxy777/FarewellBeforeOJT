<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Gallery Overlay + Lightbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
        }

        /* Open button */
        .open-gallery {
            margin: 20px;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: #007bff;
            color: #fff;
            border-radius: 6px;
        }

        /* Fullscreen overlay container */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        /* Close overlay button (top-right) */
        .close-btn {
            position: absolute;
            top: 16px;
            right: 22px;
            font-size: 32px;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }

        /* Gallery grid inside overlay */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            width: min(1100px, 92vw);
            max-height: 82vh;
            overflow: auto;
            padding: 10px;
        }

        .gallery img {
            height: 240px;
            /* fixed height */
            width: auto;
            /* keep aspect ratio */
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: scale(0.5);
            animation: zoomIn 0.6s forwards;
            cursor: pointer;
            background: #111;
            /* nicer for transparent PNG/SVG */
        }

        @keyframes zoomIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Lightbox (click an image to view big) */
        .lightbox {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1100;
            /* on top of gallery */
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 22px;
            background: none;
            border: none;
            color: #fff;
            font-size: 34px;
            cursor: pointer;
            line-height: 1;
        }

        /* Optional hint (bottom) */
        .hint {
            color: #aaa;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <button class="open-gallery" id="openBtn">Show Gallery</button>

    <!-- Overlay with gallery -->
    <div class="overlay" id="overlay">
        <button class="close-btn" id="overlayClose" aria-label="Close overlay">&times;</button>

        <div class="gallery" id="gallery"></div>
        <div class="hint">Tip: click an image to view it. Use ← → keys, Esc to close.</div>

        <!-- Lightbox inside overlay -->
        <div class="lightbox" id="lightbox" aria-modal="true" role="dialog">
            <button class="lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
            <img id="lightboxImg" alt="Zoomed image" />
        </div>
    </div>

    <script>
        const images = [
            "assets/pic1.png",
            "assets/pic2.png",
            "assets/pic3.png",
            "assets/pic4.png",
            "assets/pic5.png"
        ];

        const openBtn = document.getElementById("openBtn");
        const overlay = document.getElementById("overlay");
        const overlayClose = document.getElementById("overlayClose");
        const gallery = document.getElementById("gallery");

        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxClose = document.getElementById("lightboxClose");

        let currentIndex = -1; // for lightbox navigation

        // Open overlay and build animated gallery
        openBtn.addEventListener("click", () => {
            overlay.style.display = "flex";
            gallery.innerHTML = "";

            images.forEach((src, i) => {
                const img = document.createElement("img");
                img.src = src;
                img.alt = `Image ${i + 1}`;
                img.style.animationDelay = `${i * 0.18}s`; // staggered pop-in
                img.dataset.index = i;
                img.addEventListener("click", () => openLightbox(i));
                gallery.appendChild(img);
            });
        });

        // Close overlay (and any open lightbox)
        overlayClose.addEventListener("click", closeOverlay);
        function closeOverlay() {
            closeLightbox();
            overlay.style.display = "none";
        }

        // Lightbox controls
        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[currentIndex];
            lightbox.classList.add("active");
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            lightboxImg.src = "";
            currentIndex = -1;
        }

        lightboxClose.addEventListener("click", closeLightbox);

        // Close lightbox by clicking its dark background
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Keyboard: Esc closes, Left/Right navigate when lightbox open
        document.addEventListener("keydown", (e) => {
            const lbOpen = lightbox.classList.contains("active");
            if (e.key === "Escape") {
                if (lbOpen) closeLightbox(); else closeOverlay();
            }
            if (!lbOpen) return;

            if (e.key === "ArrowRight") {
                currentIndex = (currentIndex + 1) % images.length;
                lightboxImg.src = images[currentIndex];
            } else if (e.key === "ArrowLeft") {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                lightboxImg.src = images[currentIndex];
            }
        });
    </script>
</body>

</html>
